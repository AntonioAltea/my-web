<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>manturón</title>
  <meta
    name="description"
    content="Musica y fotografia en una web personal sencilla, artesanal y viva."
  >
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://bandcamp.com">
  <link rel="preconnect" href="https://f4.bcbits.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400&display=swap"
    rel="stylesheet"
  >
  <script>
    (() => {
      const savedTheme = window.localStorage.getItem("manturon-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="page">
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Tema automatico. Cambiar a modo oscuro"
      aria-pressed="false"
    >
      <span class="theme-toggle-badge" aria-hidden="true"></span>
      <span id="theme-toggle-label">auto</span>
    </button>
    <a id="back-link" class="back-link" href="#/" aria-label="Volver" hidden>
      <span aria-hidden="true">&lt;</span>
    </a>

    <header class="site-header">
      <h1><a id="home-link" class="home-link" href="#/">manturón</a></h1>
    </header>

    <main class="view-shell">
      <section id="view-inicio" class="view view-inicio" aria-label="Inicio">
        <nav class="home-menu">
          <a class="home-menu-item" href="#/fotos">fotos</a>
          <a class="home-menu-item" href="#/musica">música</a>
          <a class="home-menu-item" href="#/fanzines">fanzines</a>
        </nav>
      </section>

      <section id="view-fotos" class="view gallery-shell" aria-label="Fotos" hidden>
        <figure class="gallery-stage">
          <div id="photo-loader" class="photo-loader" hidden>cargando...</div>
          <img id="main-photo" class="main-photo" src="" alt="" hidden>

          <figcaption class="gallery-meta">
            <div class="gallery-nav-row">
              <button id="prev-photo" class="gallery-nav gallery-nav-prev" type="button" aria-label="Foto anterior">
                <span aria-hidden="true">anterior</span>
              </button>
              <button id="photo-random" class="gallery-nav gallery-nav-mode" type="button" aria-label="Ir a una foto aleatoria">
                azar
              </button>
              <button id="next-photo" class="gallery-nav gallery-nav-next" type="button" aria-label="Foto siguiente">
                <span aria-hidden="true">siguiente</span>
              </button>
            </div>
            <span id="photo-caption" class="photo-caption">No hay fotos todavia.</span>
          </figcaption>
        </figure>
      </section>

      <section id="view-musica" class="view view-scroll" aria-label="Música" hidden>
        <h2 class="section-title">
          <a href="https://manturon.bandcamp.com" target="_blank" rel="noopener">bandcamp</a>
        </h2>
        <ul id="album-grid" class="album-grid"></ul>

        <h2 class="section-title">
          <a href="https://www.youtube.com/@manturon" target="_blank" rel="noopener">youtube</a>
        </h2>
        <iframe
          id="latest-video"
          class="latest-video"
          title="Último vídeo de manturón en YouTube"
          allow="encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
        ></iframe>
      </section>

      <section id="view-fanzines" class="view" aria-label="Fanzines" hidden>
        <div id="zine-index" class="zine-index">
          <p id="zine-status" class="section-note">cargando...</p>
          <ul id="zine-grid" class="zine-grid"></ul>
        </div>

        <div id="zine-reader" class="zine-reader" hidden>
          <div id="zine-spread" class="zine-spread"></div>
          <div class="zine-nav-row">
            <button id="zine-prev" class="gallery-nav" type="button" aria-label="Página anterior">
              <span aria-hidden="true">anterior</span>
            </button>
            <span id="zine-progress" class="zine-progress" aria-live="polite"></span>
            <button id="zine-next" class="gallery-nav" type="button" aria-label="Página siguiente">
              <span aria-hidden="true">siguiente</span>
            </button>
          </div>
          <div class="zine-tools">
            <button id="zine-layout" class="zine-tool" type="button" aria-pressed="false"></button>
            <a id="zine-download" class="zine-tool" href="" download hidden>descargar pdf</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-bar-inner">
      <div class="album-picker">
        <button
          id="album-toggle"
          class="album-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="album-list"
        >
          <span class="album-toggle-label">álbum</span>
          <span id="album-toggle-current" class="album-toggle-current"></span>
        </button>
        <ul id="album-list" class="album-list" aria-label="Elegir álbum" hidden></ul>
      </div>
      <div class="bandcamp-player-shell">
        <div id="bandcamp-loader" class="bandcamp-loader">cargando reproductor...</div>
        <img id="bandcamp-cover" class="bandcamp-cover" src="" alt="">
        <iframe
          id="bandcamp-player"
          class="bandcamp-player"
          title="Reproductor de Bandcamp"
          seamless
        ></iframe>
      </div>
      <noscript>
        <a href="https://manturon.bandcamp.com">discografía de manturón en Bandcamp</a>
      </noscript>
    </div>
  </footer>

  <script src="/static/js/media-api.js"></script>
  <script src="/static/js/analytics.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/router.js"></script>
  <script src="/static/js/gallery.js"></script>
  <script src="/static/js/music.js"></script>
  <script src="/static/js/zines.js"></script>
  <script src="/static/js/bandcamp.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
