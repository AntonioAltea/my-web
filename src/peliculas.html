<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>películas · manturón</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" sizes="any">
  <script>
    (() => {
      const savedTheme = window.localStorage.getItem("manturon-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/peliculas.css">
</head>
<body>
  <main class="movies-page">
    <header class="movies-header">
      <h1>películas</h1>
      <div class="movies-header-side">
        <p id="movies-session" class="movies-session" hidden>
          eres <strong id="movies-session-name"></strong>
          · <button id="movies-change-name" class="movies-link" type="button">cambiar</button>
          · <button id="movies-logout" class="movies-link" type="button">salir</button>
        </p>
        <!-- The same theme control as the rest of the site (static/js/theme.js),
             so the choice is shared with the home page. -->
        <button
          id="theme-toggle"
          class="movies-link movies-theme-toggle"
          type="button"
          aria-label="Tema automatico. Cambiar a modo oscuro"
          aria-pressed="false"
        >tema: <span id="theme-toggle-label">auto</span></button>
      </div>
    </header>

    <p id="movies-page-status" class="movies-error" role="alert" hidden></p>

    <section id="movies-who" class="movies-who" aria-labelledby="movies-who-label" hidden>
      <span id="movies-who-label">¿quién eres?</span>
      <div id="movies-who-options" class="movies-chips" role="group" aria-labelledby="movies-who-label"></div>
      <p id="movies-name-hint" class="movies-error" role="alert" hidden></p>
    </section>

    <form id="movies-login" class="movies-login" hidden>
      <label for="movies-password">contraseña</label>
      <div class="movies-row">
        <input id="movies-password" type="password" autocomplete="current-password" required>
        <button type="submit">entrar</button>
      </div>
      <p id="movies-login-error" class="movies-error" role="alert"></p>
    </form>

    <div id="movies-app" hidden>

      <section class="movies-search" aria-label="Añadir película">
        <input
          id="movies-query"
          type="search"
          placeholder="busca película, director o actor"
          aria-label="Buscar película, director o actor"
          autocomplete="off"
          enterkeyhint="search"
        >
        <p id="movies-search-status" class="movies-muted" aria-live="polite" hidden></p>
        <div id="movies-results" class="movies-results"></div>
      </section>

      <section class="movies-toolbar" aria-label="Lista">
        <p id="movies-count" class="movies-count" aria-live="polite"></p>
        <button
          id="movies-filters-toggle"
          class="movies-filters-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="movies-filters"
        >filtros <span id="movies-filters-count" class="movies-badge"></span></button>
        <div id="movies-sort" class="movies-sort">
          <button
            id="movies-sort-toggle"
            class="movies-sort-toggle"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="movies-sort-menu"
          ><span class="movies-sort-icon" aria-hidden="true">⇅</span> <span id="movies-sort-label"></span></button>
          <div id="movies-sort-menu" class="movies-sort-menu" role="menu" aria-label="Ordenar por" hidden></div>
        </div>
        <button id="movies-random" class="movies-random" type="button">elegir una al azar</button>
      </section>

      <p id="movies-filters-summary" class="movies-filters-summary" hidden>
        <span id="movies-filters-summary-text"></span>
        <button class="movies-link movies-clear-filters" type="button">quitar filtros</button>
      </p>

      <section id="movies-filters" class="movies-filters" aria-label="Filtros" hidden>
        <div class="movies-filter">
          <p class="movies-filter-label" id="movies-by-label">en casa</p>
          <div id="movies-by" class="movies-tags" role="group" aria-labelledby="movies-by-label"></div>
          <div id="movies-match" class="movies-match" role="radiogroup" aria-label="Cuánto tiene que encajar">
            <button type="button" role="radio" data-match="lax" aria-checked="true" disabled title="La quiere ver alguno de los que estáis">alguno</button>
            <button type="button" role="radio" data-match="strict" aria-checked="false" disabled title="La queréis ver todos los que estáis">todos</button>
            <button type="button" role="radio" data-match="ideal" aria-checked="false" disabled title="La queréis ver todos los que estáis y los que no están dijeron «yo no»">ideal</button>
          </div>
        </div>
        <div class="movies-filter">
          <p class="movies-filter-label">
            <label for="movies-duration">duración</label>
            <output id="movies-duration-value" for="movies-duration"></output>
          </p>
          <input id="movies-duration" class="movies-slider" type="range">
          <div class="movies-slider-scale" aria-hidden="true">
            <span>1 h</span><span>2 h</span><span>sin límite</span>
          </div>
        </div>
        <div class="movies-filter">
          <p class="movies-filter-label" id="movies-genres-label">género</p>
          <div id="movies-genres" class="movies-tags" role="group" aria-labelledby="movies-genres-label"></div>
        </div>
        <button class="movies-link movies-clear-filters" type="button">quitar filtros</button>
      </section>

      <section id="movies-pick" class="movies-pick" aria-live="polite" hidden>
        <p class="movies-pick-label">esta noche toca…</p>
        <div id="movies-pick-card"></div>
        <div class="movies-row">
          <button id="movies-pick-again" type="button">otra</button>
          <button id="movies-pick-close" class="movies-link" type="button">cerrar</button>
        </div>
      </section>

      <p id="movies-list-status" class="movies-empty" aria-live="polite" hidden></p>
      <ul id="movies-list" class="movies-list"></ul>
      <button id="movies-unwanted" class="movies-link movies-unwanted" type="button" hidden></button>

      <p class="movies-footer">
        Datos e imágenes de <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>.
        This product uses the TMDB API but is not endorsed or certified by TMDB.
      </p>
    </div>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/movies.js"></script>
</body>
</html>
