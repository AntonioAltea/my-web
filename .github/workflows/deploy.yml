# Deploy to Fly on every push to main (from your computer the pre-push hook has run the tests first).
# Needs the secret FLY_API_TOKEN (fly tokens create deploy -a manturon).
name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --yes -a manturon
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
